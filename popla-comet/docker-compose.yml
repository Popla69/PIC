version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: popla-comet-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG=true
    volumes:
      - ./backend:/app
      - backend-cache:/root/.cache
    restart: unless-stopped
    networks:
      - popla-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  backend-cache:
    driver: local

networks:
  popla-network:
    driver: bridge
